<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MINIMAL TILES</title>
<style>
  :root { color-scheme: light; --ink:#171717; --paper:#f7f7f4; --line:#deded8; }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; min-height:100%; background:var(--paper); color:var(--ink); font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif; }
  body { min-height:100svh; display:flex; justify-content:center; align-items:center; padding:18px; }
  .app { width:min(100%,460px); }
  header { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:16px; }
  .eyebrow { font-size:10px; letter-spacing:.22em; color:#777; margin-bottom:7px; }
  h1 { font-size:23px; letter-spacing:.11em; margin:0; font-weight:700; }
  .scorebox { text-align:right; }
  .score-label { font-size:10px; letter-spacing:.18em; color:#777; }
  #score { font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1; }
  .board-wrap { position:relative; width:100%; height:min(68svh,650px); min-height:390px; border:1px solid var(--line); background:#fff; overflow:hidden; touch-action:pan-y; user-select:none; }
  #board { width:100%; height:100%; display:grid; grid-template-columns:repeat(4,1fr); position:relative; }
  .lane { position:relative; border-right:1px solid var(--line); background:#fff; }
  .lane:last-child { border-right:0; }
  .lane:nth-child(even) { background:#fcfcfa; }
  .tile { position:absolute; left:5px; right:5px; height:108px; background:var(--ink); border-radius:2px; cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,.08); }
  .tile:active { background:#454545; }
  .hit-line { position:absolute; z-index:3; left:0; right:0; bottom:20px; border-top:1px solid #bcbcb5; pointer-events:none; }
  .hit-label { position:absolute; z-index:4; right:9px; bottom:25px; color:#aaa; background:#fff; padding:2px 5px; font-size:9px; letter-spacing:.16em; pointer-events:none; }
  .overlay { position:absolute; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; background:rgba(247,247,244,.94); }
  .overlay.hidden { display:none; }
  .overlay h2 { margin:0 0 10px; font-size:25px; letter-spacing:.12em; }
  .overlay p { color:#777; font-size:13px; line-height:1.7; margin:0 0 22px; max-width:270px; }
  button { border:0; background:var(--ink); color:white; padding:14px 34px; font-size:12px; letter-spacing:.18em; cursor:pointer; border-radius:2px; }
  button:active { transform:translateY(1px); }
  .sub { margin-top:17px; color:#999; font-size:10px; letter-spacing:.1em; line-height:1.7; }
  footer { display:flex; justify-content:space-between; color:#999; font-size:10px; letter-spacing:.12em; margin-top:12px; }
  #toast { position:absolute; z-index:4; top:14px; left:0; right:0; text-align:center; font-size:11px; letter-spacing:.16em; color:#777; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
  @media (max-width:380px) { body{padding:12px} .board-wrap{min-height:360px;height:66svh} .tile{height:94px} }
</style>
</head>
<body>
<main class="app">
  <header>
    <div><div class="eyebrow">A SMALL RHYTHM GAME</div><h1>MINIMAL TILES</h1></div>
    <div class="scorebox"><div class="score-label">SCORE</div><div id="score">000</div></div>
  </header>
  <section class="board-wrap" aria-label="游戏区域">
    <div id="board">
      <div class="lane" data-lane="0"></div><div class="lane" data-lane="1"></div>
      <div class="lane" data-lane="2"></div><div class="lane" data-lane="3"></div>
    </div>
    <div class="hit-line"></div><div class="hit-label">TAP</div><div id="toast">PERFECT</div>
    <div class="overlay" id="overlay">
      <div class="eyebrow">FOUR LANES · ONE BEAT</div>
      <h2 id="overlay-title">READY TO PLAY?</h2>
      <p id="overlay-copy">点击下落的黑色方块。不要漏掉，也不要点击白色区域。</p>
      <button id="start">START</button>
      <div class="sub">电脑：D · F · J · K<br>手机：直接触摸方块</div>
    </div>
  </section>
  <footer><span>BEST <b id="best">000</b></span><span>KEEP THE RHYTHM</span></footer>
</main>
<script>
(() => {
  const board = document.getElementById('board');
  const lanes = [...document.querySelectorAll('.lane')];
  const overlay = document.getElementById('overlay');
  const title = document.getElementById('overlay-title');
  const copy = document.getElementById('overlay-copy');
  const startBtn = document.getElementById('start');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const toast = document.getElementById('toast');
  const hitLine = 20;
  let tiles = [], score = 0, running = false, lastTime = 0, spawnTimer = 0;
  let speed = 210, spawnEvery = 720, audioCtx = null, toastTimer = null;
  let best = Number(localStorage.getItem('minimalTilesBest') || 0);
  bestEl.textContent = String(best).padStart(3,'0');

  function sound(lane) {
    try {
      audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = [261.63,293.66,329.63,392.00];
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const now = audioCtx.currentTime;
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(notes[lane], now);
      osc.frequency.exponentialRampToValueAtTime(notes[lane] * 0.995, now + .22);
      gain.gain.setValueAtTime(.0001, now);
      gain.gain.exponentialRampToValueAtTime(.16, now + .008);
      gain.gain.exponentialRampToValueAtTime(.0001, now + .34);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + .36);
    } catch(e) {}
  }

  function updateScore() { scoreEl.textContent = String(score).padStart(3,'0'); }
  function spawnTile() {
    const lane = Math.floor(Math.random() * 4);
    const el = document.createElement('div');
    el.className = 'tile';
    el.setAttribute('role','button');
    el.setAttribute('aria-label','黑色音符');
    lanes[lane].appendChild(el);
    const tile = { lane, y: -112, el, hit:false };
    el.addEventListener('pointerdown', e => { e.preventDefault(); hit(tile); });
    tiles.push(tile);
  }
  function hit(tile) {
    if (!running || tile.hit) return;
    tile.hit = true;
    sound(tile.lane);
    tile.el.remove();
    tiles = tiles.filter(t => t !== tile);
    score++; updateScore();
    speed = Math.min(430, 210 + score * 3.2);
    spawnEvery = Math.max(390, 720 - score * 4);
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 180);
  }
  function endGame() {
    running = false;
    tiles.forEach(t => t.el.remove()); tiles = [];
    if (score > best) { best = score; localStorage.setItem('minimalTilesBest', best); bestEl.textContent = String(best).padStart(3,'0'); }
    title.textContent = 'GAME OVER';
    copy.textContent = `你的得分是 ${score}。再试一次，看看能不能打破最高纪录。`;
    startBtn.textContent = 'PLAY AGAIN';
    overlay.classList.remove('hidden');
  }
  function loop(time) {
    if (!running) return;
    const dt = Math.min((time - lastTime) / 1000 || 0, .04);
    lastTime = time;
    spawnTimer += dt * 1000;
    if (spawnTimer >= spawnEvery) { spawnTimer = 0; spawnTile(); }
    const boardHeight = board.clientHeight;
    for (const tile of [...tiles]) {
      tile.y += speed * dt;
      tile.el.style.transform = `translateY(${tile.y}px)`;
      if (tile.y + 108 >= boardHeight - hitLine) { endGame(); return; }
    }
    requestAnimationFrame(loop);
  }
  function startGame() {
    tiles.forEach(t => t.el.remove()); tiles = [];
    score = 0; speed = 210; spawnEvery = 720; spawnTimer = 0;
    updateScore(); running = true;
    overlay.classList.add('hidden');
    lastTime = performance.now();
    spawnTile();
    requestAnimationFrame(loop);
  }
  startBtn.addEventListener('click', startGame);
  board.addEventListener('pointerdown', e => {
    if (!running) return;
    if (!e.target.classList.contains('tile')) endGame();
  });
  document.addEventListener('keydown', e => {
    if (!running || e.repeat) return;
    const map = {d:0,f:1,j:2,k:3};
    const lane = map[e.key.toLowerCase()];
    if (lane === undefined) return;
    const candidates = tiles.filter(t => t.lane === lane).sort((a,b) => b.y-a.y);
    if (candidates.length) hit(candidates[0]);
    else endGame();
  });
})();
</script>
</body>
</html>
